<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>立体书</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="可翻页的纸艺立体书。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app" id="app" data-chrome="sidebar" data-side="right" data-state="closed">
    <main class="stage">
      <div class="view">
        <canvas id="view" aria-label="立体书画面"></canvas>
        <section class="sheet" id="index" hidden>
          <header class="sheet-head">
            <strong id="index-title">目录</strong>
            <button type="button" class="plain" id="index-close">收起</button>
          </header>
          <div class="sheet-body" id="index-list"></div>
          <footer class="sheet-foot">
            <button type="button" class="plain" id="btn-reset">回到第一跨页</button>
          </footer>
        </section>
        <p class="banner" id="banner" role="alert" hidden></p>
      </div>

      <!-- The bar sits under the canvas, in flow: nothing here ever covers the book. -->
      <footer class="bar" id="bar">
        <div class="bar-title">
          <span class="bar-kicker" id="bar-kicker"></span>
          <strong class="bar-heading" id="bar-heading"></strong>
        </div>
        <div class="bar-gate">
          <span class="bar-note" id="gate-note" aria-live="polite">装订中…</span>
          <button type="button" class="primary" id="gate-open" disabled>翻开</button>
        </div>
        <div class="bar-nav">
          <button type="button" class="arrow" id="nav-prev" aria-label="上一跨页">‹</button>
          <span class="dots" id="nav-dots" aria-hidden="true"></span>
          <span class="counter" id="hud-counter">—</span>
          <button type="button" class="arrow" id="nav-next" aria-label="下一跨页">›</button>
        </div>
        <div class="bar-tools">
          <button type="button" class="plain" id="btn-narrate" hidden>朗读</button>
          <button type="button" class="plain" id="btn-index" aria-expanded="false">目录</button>
          <button type="button" class="plain" id="btn-sound" aria-pressed="true">纸声</button>
          <button type="button" class="plain" id="btn-close">合上</button>
        </div>
      </footer>
    </main>

    <aside class="reader" id="reader">
      <header class="reader-head">
        <span class="reader-kicker" id="reader-kicker"></span>
        <strong id="reader-spread"></strong>
      </header>
      <ol class="passages" id="passages"></ol>
      <footer class="reader-foot" id="reader-foot"></footer>
    </aside>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
